$kind: http-request
description: |-
  **Qué decir:** Bloquear una fecha no elimina ni modifica las franjas recurrentes.

  **Qué esperar:** 200 con las mismas franjas semanales de antes.
url: "{{base}}/api/ofertas/{{idServicio}}/disponibilidad"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Siguen las franjas semanales', () => pm.expect(pm.response.json().filter(x => x.tipo === 'SEMANAL').length).to.be.at.least(2));
    language: text/javascript
order: 12000
