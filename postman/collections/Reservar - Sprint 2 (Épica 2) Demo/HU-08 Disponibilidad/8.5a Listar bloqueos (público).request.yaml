$kind: http-request
description: |-
  **Qué decir:** Consulta pública de los bloqueos en un rango de fechas.

  **Qué esperar:** 200 con los dos bloqueos creados (día A completo y día B parcial).
url: "{{base}}/api/ofertas/{{idServicio}}/bloqueos?fechaInicio={{fechaDesde}}&fechaFin={{fechaHasta}}"
method: GET
queryParams:
  fechaInicio: "{{fechaDesde}}"
  fechaFin: "{{fechaHasta}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Al menos 2 bloqueos', () => pm.expect(pm.response.json().length).to.be.at.least(2));
    language: text/javascript
order: 17000
