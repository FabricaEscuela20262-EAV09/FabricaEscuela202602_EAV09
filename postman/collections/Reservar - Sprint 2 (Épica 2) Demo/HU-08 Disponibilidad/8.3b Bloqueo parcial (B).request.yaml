$kind: http-request
description: |-
  **Qué decir:** También se puede bloquear solo un rango de horas de esa fecha.

  **Qué esperar:** 201 con `diaCompleto: false` (11:00 a 12:00 en el día B).
url: "{{base}}/api/ofertas/{{idServicio}}/bloqueos"
method: POST
headers:
  Authorization: Bearer {{tokenProv}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fecha": "{{fechaB}}",
      "horaInicio": "11:00:00",
      "horaFin": "12:00:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201));
      pm.test('No es dia completo', () => pm.expect(pm.response.json().diaCompleto).to.eql(false));
    language: text/javascript
order: 11000
