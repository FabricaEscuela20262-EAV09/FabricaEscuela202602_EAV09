$kind: http-request
description: |-
  **Qué decir:** El motivo debe ser RESERVADO u OTRO (RESERVADO se usará en el Sprint 3).

  **Qué esperar:** 400, `MOTIVO_BLOQUEO_INVALIDO`.
url: "{{base}}/api/ofertas/{{idServicio}}/bloqueos"
method: POST
headers:
  Authorization: Bearer {{tokenProv}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fecha": "{{fechaMotivo}}",
      "motivo": "VACACIONES"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 400', () => pm.response.to.have.status(400));
      pm.test('codigo = MOTIVO_BLOQUEO_INVALIDO', () => pm.expect(pm.response.json().codigo).to.eql('MOTIVO_BLOQUEO_INVALIDO'));
    language: text/javascript
order: 16000
