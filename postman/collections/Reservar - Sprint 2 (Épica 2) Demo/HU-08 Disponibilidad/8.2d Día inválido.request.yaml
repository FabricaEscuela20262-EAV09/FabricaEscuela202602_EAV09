$kind: http-request
description: |-
  **Qué decir:** El día debe ser uno de LUNES a DOMINGO.

  **Qué esperar:** 400, `DIA_SEMANA_INVALIDO`.
url: "{{base}}/api/ofertas/{{idServicio}}/disponibilidad"
method: POST
headers:
  Authorization: Bearer {{tokenProv}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "diaSemana": "FUNDAY",
      "horaInicio": "09:00:00",
      "horaFin": "10:00:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 400', () => pm.response.to.have.status(400));
      pm.test('codigo = DIA_SEMANA_INVALIDO', () => pm.expect(pm.response.json().codigo).to.eql('DIA_SEMANA_INVALIDO'));
    language: text/javascript
order: 7000
