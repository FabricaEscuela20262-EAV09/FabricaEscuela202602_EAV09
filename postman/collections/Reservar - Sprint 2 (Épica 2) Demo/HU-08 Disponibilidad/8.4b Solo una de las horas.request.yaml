$kind: http-request
description: |-
  **Qué decir:** O se indican ambas horas o ninguna.

  **Qué esperar:** 400, `INTERVALO_HORARIO_INVALIDO`.
url: "{{base}}/api/ofertas/{{idServicio}}/bloqueos"
method: POST
headers:
  Authorization: Bearer {{tokenProv}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fecha": "{{fechaUnaHora}}",
      "horaInicio": "09:00:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 400', () => pm.response.to.have.status(400));
      pm.test('codigo = INTERVALO_HORARIO_INVALIDO', () => pm.expect(pm.response.json().codigo).to.eql('INTERVALO_HORARIO_INVALIDO'));
    language: text/javascript
order: 14000
