$kind: http-request
description: |-
  **Qué decir:** El proveedor desactiva su oferta.

  **Qué esperar:** 204 sin contenido.
url: "{{base}}/api/ofertas/{{idServicio}}/desactivar"
method: PATCH
headers:
  Authorization: Bearer {{tokenProv}}
scripts:
  - type: afterResponse
    code: pm.test('Responde 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 1000
