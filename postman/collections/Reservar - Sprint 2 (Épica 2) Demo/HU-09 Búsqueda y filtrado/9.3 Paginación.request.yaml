$kind: http-request
description: |-
  **Qué decir:** Texto y categoría combinados, con tamaño de página 5. No se cargan todos los resultados de una sola vez.

  **Qué esperar:** 200 con `size: 5` y los campos `totalElements` y `totalPages`.
url: "{{base}}/api/ofertas?texto=prueba&idCategoria={{idCategoria}}&page=0&size=5"
method: GET
queryParams:
  texto: prueba
  idCategoria: "{{idCategoria}}"
  page: "0"
  size: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Tamano de pagina 5', () => pm.expect(j.size).to.eql(5));
      pm.test('Trae totales', () => { pm.expect(j.totalElements).to.be.a('number'); pm.expect(j.totalPages).to.be.a('number'); });
    language: text/javascript
order: 3000
