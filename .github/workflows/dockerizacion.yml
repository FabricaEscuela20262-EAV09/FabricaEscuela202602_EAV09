name: Dockerizacion y publicacion en Docker Hub

on:
  workflow_run:
    workflows: ["Build y análisis SonarCloud"]
    types:
      - completed
    branches:
      - main

jobs:
  docker:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verificacion de commit aprobado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configuración para Docker
        uses: docker/setup-buildx-action@v3

      - name: Logueo en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            dialva98/fabricaescuela202602_eav09:latest
            dialva98/fabricaescuela202602_eav09:${{ github.event.workflow_run.head_sha }}