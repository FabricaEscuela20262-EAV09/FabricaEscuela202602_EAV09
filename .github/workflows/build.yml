name: Build y análisis SonarCloud

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    types: [opened, synchronize, reopened]

# Mínimo privilegio para el GITHUB_TOKEN de todos los jobs.
permissions:
  contents: read

# Las actions de terceros se fijan al SHA completo del commit (SonarCloud githubactions:S7637);
# el comentario indica la versión publicada a la que corresponde cada SHA.

jobs:
  build:
    name: Pruebas, cobertura y SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # sonar.qualitygate.wait hace fallar el job si el Quality Gate «EAV09 - Calidad» queda en rojo,
      # así un gate fallido bloquea la publicación de la imagen (ADR-15).
      - name: Pruebas unitarias + JaCoCo + análisis Sonar + Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

  # ADR-15: la imagen solo se publica si el job de pruebas y SonarCloud terminó bien, y se construye
  # exactamente el commit analizado (github.sha). Solo corre en push a main del propio repositorio:
  # nunca en pull_request, así que el código de un fork no llega a un contexto con secretos
  # (SonarCloud githubactions:S7631).
  docker:
    name: Dockerizacion y publicacion en Docker Hub
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verificacion de commit aprobado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configuración para Docker
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Logueo en Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            dialva98/fabricaescuela202602_eav09:latest
            dialva98/fabricaescuela202602_eav09:${{ github.sha }}

      - name: Desplegar nueva imagen en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$RENDER_DEPLOY_HOOK_URL"
